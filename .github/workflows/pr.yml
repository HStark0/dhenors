# Em cada pull request: mesmas checagens da publicação e uma PRÉVIA
# para testar no celular antes de juntar na main. A prévia é o arquivo
# único (dist/dhenors.html) com as capturas de tela das telas principais,
# anexados ao PR como artefato "previa-<número>" (baixe e abra o HTML).
name: Pull request

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  check-and-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run sync
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Testes no navegador (com capturas)
        run: npx playwright install --with-deps chromium && npm run e2e
      - name: Gera a prévia
        run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: previa-${{ github.event.pull_request.number }}
          path: |
            dist/dhenors.html
            playwright-report
          retention-days: 14
      - name: Comenta no PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `**Prévia do Dhenors** pronta: baixe o artefato \`previa-${context.issue.number}\` em ${run} e abra \`dist/dhenors.html\` (funciona sem servidor). As capturas das telas estão em \`playwright-report\`.`;
            const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number: context.issue.number });
            const mine = comments.find((c) => c.body?.startsWith('**Prévia do Dhenors**'));
            if (mine) await github.rest.issues.updateComment({ ...context.repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
