# Em cada pull request: mesmas checagens da publicação e uma PRÉVIA
# para testar no celular antes de juntar na main. A prévia é o arquivo
# único (dist/dhenors.html) com as capturas de tela das telas principais,
# anexados ao PR como artefato "previa-<número>" (baixe e abra o HTML).
#
# Permissões separadas: o job que instala dependências e roda código do
# PR (npm ci, testes) só LÊ o repositório; o comentário no PR fica num
# job à parte, que não baixa nem executa nada do PR.
name: Pull request

on:
  pull_request:

permissions:
  contents: read

jobs:
  check-and-preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run sync
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Testes no navegador (com capturas)
        run: npx playwright install --with-deps chromium && npm run e2e
      - name: Gera a prévia
        run: npm run build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: previa-${{ github.event.pull_request.number }}
          path: |
            dist/dhenors.html
            playwright-report
          retention-days: 14

  comment:
    needs: check-and-preview
    if: always()
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Comenta no PR
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `**Prévia do Dhenors** pronta: baixe o artefato \`previa-${context.issue.number}\` em ${run} e abra \`dist/dhenors.html\` (funciona sem servidor). As capturas das telas estão em \`playwright-report\`.`;
            const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number: context.issue.number });
            const mine = comments.find((c) => c.body?.startsWith('**Prévia do Dhenors**'));
            if (mine) await github.rest.issues.updateComment({ ...context.repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
