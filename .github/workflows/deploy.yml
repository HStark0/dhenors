# Publica o Dhenors no GitHub Pages a cada envio para a branch main.
# Configuração (uma vez): Settings → Pages → Source: "GitHub Actions".
# Antes de publicar: lint, tipos, testes de cálculo e testes no navegador.
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Mínimo para todos; só o job de publicação recebe pages/id-token.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Versão sincronizada (index, manifest, service worker)
        run: npm run sync && git diff --exit-code -- js/version.js sw-assets.js || (echo "::error::Rode 'npm run sync' e envie js/version.js e sw-assets.js" && exit 1)
      - name: Lint
        run: npm run lint
      - name: Tipos (JSDoc)
        run: npm run typecheck
      - name: Testes dos cálculos
        run: npm test
      - name: Testes no navegador
        run: npx playwright install --with-deps chromium && npm run e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: relatorio-e2e
          path: playwright-report
          retention-days: 7

  build:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Gera o arquivo único (dist/dhenors.html)
        run: npm run build
      - name: Monta o site
        run: |
          mkdir -p _site
          cp -r index.html manifest.webmanifest sw.js sw-assets.js css js assets dist site docs CHANGELOG.md _site/
          [ -f landing.html ] && cp landing.html _site/ || true
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
