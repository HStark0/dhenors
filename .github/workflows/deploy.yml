# Publica o Dhenors no GitHub Pages a cada envio para a branch main.
# Configuração (uma vez): Settings → Pages → Source: "GitHub Actions".
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Testes dos cálculos
        run: npm test
      - name: Gera o arquivo único (dist/dhenors.html)
        run: npm install --no-audit --no-fund && npm run build
      - name: Monta o site
        run: |
          mkdir -p _site
          cp -r index.html manifest.webmanifest sw.js css js assets dist _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
